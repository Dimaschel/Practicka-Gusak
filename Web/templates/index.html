<!DOCTYPE html>
<html>
<head>
    <title>Vacancies</title>
</head>
<body>
    <h1>Поиск вакансий</h1>
    <form action="/" method="post">
        <label for="query">Ключевое слово:</label>
        <input type="text" id="query" name="query" required>
        <label for="city">Город:</label>
        <input type="text" id="city" name="city" required>
        <label for="num_vacancies">Количество вакансий:</label>
        <input type="number" id="num_vacancies" name="num_vacancies" required>
        <button type="submit">Поиск вакансий</button>
    </form>
    
    <h2>Вывод</h2>
    <ul>
    {% for vacancy in vacancies %}
        <li>
            <strong>{{ vacancy['name'] }}</strong><br>
            Salary: {{ vacancy['salary'] if vacancy['salary'] else 'Not specified' }}<br>
            Requirements: {{ vacancy['snippet']['requirement'] if vacancy['snippet']['requirement'] else 'Not specified' }}
        </li>
    {% endfor %}
    </ul>
</body>
</html>
